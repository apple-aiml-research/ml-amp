[project]
name = "amp"
version = "0.1.0"
description = "Run LLM agents on robot harnesses and evaluate them on RoboLab, CaP-Gym and RoboDojo"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=13.0.0",
  "opencv-python-headless>=4.9",
  "pyyaml>=6",
]


[project.scripts]
amp = "amp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp"]
exclude = ["__pycache__", "*.pyc"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/amp/harnesses/amp1_assistive/robolab_harness/_manual" = "amp/harnesses/amp1_assistive/robolab_harness/_manual"
"src/amp/harnesses/amp1_assistive/robolab_harness/_assist" = "amp/harnesses/amp1_assistive/robolab_harness/_assist"

[tool.hatch.build.targets.sdist]
exclude = ["/external", "/.worktrees", "/.venv", "/internal"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
